name: Verify
on:
  push:
    branches: [main, 'cloud/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Four parallel shards keep each push Verify under 15 minutes; shard 1 also
  # builds the site and runs the typecheck, email-link and site tests.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y libxml2-utils
      - run: pnpm exec rer check --profile first-party
      - run: pnpm run build
      - if: matrix.shard == 1
        run: pnpm run build:site && pnpm run typecheck && pnpm run test:email-link && pnpm run test:site
      - run: node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 tests/satchel/*.test.mjs
